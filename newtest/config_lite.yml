# Lite Track Model Training Config for mpeblink v2
# Single GPU, small batch size for testing
# Uses PResNet-18 + lightweight HybridEncoder + RTDETRTransformerv2Lite

task: detection

# ---- Paths ----
data_path: /data/data4/zengwenzheng/data/dataset_building/mpeblink2_1
output_dir: ./output/lite_mpeblinkv2

# ---- Training ----
epoches: 100
last_epoch: 0

# Single GPU settings
sync_bn: False
find_unused_parameters: False
use_amp: False
use_ema: False

clip_max_norm: 0.1

# ---- Model: built manually in train_lite.py ----

# ---- Criterion (from parent project) ----
criterion: RTDETRCriterionv2
RTDETRCriterionv2:
  weight_dict:
    loss_vfl: 1
    loss_bbox_head: 5
    loss_giou_head: 2
    loss_bbox_eye: 5
    loss_giou_eye: 2
  losses: ['vfl', 'boxes']
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0

# ---- Postprocessor ----
postprocessor: RTDETRPostProcessor
RTDETRPostProcessor:
  num_top_queries: 50

# ---- Optimizer ----
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [80]
  gamma: 0.1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2000

# ---- Train DataLoader ----
train_dataloader:
  type: DataLoader
  dataset:
    type: MPEblinkV2Dataset
    img_folder: ${data_path}/train_rawframes/
    anno_file: ${data_path}/annotations/train.json
    sample_len: 30
    sample_stride: 48
    clip_length: 16
    infer_length: 16
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: ConvertPILImage, dtype: 'float32', scale: true}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 0
        ops: ['RandomPhotometricDistort']
  collate_fn:
    type: BatchImageCollateFuncion
    scales: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]
    stop_epoch: 71
  shuffle: True
  total_batch_size: 2         # small for single GPU
  num_workers: 0              # 0 = main process, easier debugging

# ---- Val DataLoader ----
val_dataloader:
  type: DataLoader
  dataset:
    type: MPEblinkV2Dataset
    img_folder: ${data_path}/val_rawframes/
    anno_file: ${data_path}/annotations/val.json
    sample_len: 30
    sample_stride: 48
    clip_length: 16
    infer_length: 16
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: ConvertPILImage, dtype: 'float32', scale: true}
  collate_fn:
    type: LiteBatchImageCollate
  shuffle: False
  total_batch_size: 2
  num_workers: 0

# ---- Runtime ----
use_focal_loss: True
eval_spatial_size: [720, 1280]  # updated from 640x360 to 1280x720
